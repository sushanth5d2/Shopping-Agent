<!doctype html><html><head><meta charset="utf-8"><title>ShopAgent</title><style>
body{width:390px;padding:16px;margin:0;font:13px system-ui;background:#080b12;color:#eef2ff}h2{margin:0 0 5px}small{color:#8c97ad}.card{background:#101622;border:1px solid #222c3e;border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;gap:7px}.row>*{flex:1}input,textarea{box-sizing:border-box;width:100%;border:1px solid #283247;background:#0a0f18;color:#fff;border-radius:9px;padding:9px;margin:5px 0;outline:0}textarea{min-height:82px;resize:vertical}button{width:100%;margin:5px 0;padding:10px;border:0;border-radius:9px;background:#765cff;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#1a2230}label{font-size:10px;color:#9ca7bb;font-weight:800}.page{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;color:#cbd5e1}.ok{color:#49e08a}.error{color:#ff8888}#out{margin-top:8px;padding:10px;background:#0b1019;border:1px solid #202a3a;border-radius:9px;line-height:1.5}
</style></head><body><h2>◈ ShopAgent</h2><small>Production shopping agent</small><div class="card"><label>API URL</label><input id="api" placeholder="https://api.yourdomain.com"><label>Account email</label><input id="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button><div id="page" class="page">Reading page…</div></div><div class="card"><label>CURRENT PRODUCT URL</label><div class="page" id="currentUrl"></div><div class="row"><button id="add">Add To-Buy</button><button id="monitor" class="secondary">Monitor</button></div><button id="ingest" class="secondary">Analyze & Compare</button></div><div class="card"><label>MULTIPLE PRODUCT URLS — ONE PER LINE</label><textarea id="urls" placeholder="https://store.example/product-a&#10;https://store.example/product-b"></textarea><label>MULTIPLE TO-BUY ITEMS — ONE PER LINE</label><textarea id="items" placeholder="Headphones&#10;USB-C cable&#10;2 kg rice"></textarea><button id="batch">Process Batch</button></div><div id="out"></div><script src="popup.js"></script></body></html>
