services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopagent
      POSTGRES_USER: shopagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopagent_secure_pass_2026}
    volumes:
      - shopagent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopagent -d shopagent"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ==========================================================
  # Backend API
  # ==========================================================
  backend:
    build:
      context: ./backend
    image: shopagent-backend:latest
    environment:
      SHOPAGENT_DATABASE_URL: postgresql+psycopg://shopagent:${POSTGRES_PASSWORD:-shopagent_secure_pass_2026}@db:5432/shopagent
      SHOPAGENT_JWT_SECRET: ${SHOPAGENT_JWT_SECRET:-shopagent-development-secret-key-32chars-min-len}
      SHOPAGENT_CORS_ORIGINS: ${SHOPAGENT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SHOPAGENT_AI_API_BASE_URL: ${SHOPAGENT_AI_API_BASE_URL:-}
      SHOPAGENT_AI_API_KEY: ${SHOPAGENT_AI_API_KEY:-}
      SHOPAGENT_AI_API_MODEL: ${SHOPAGENT_AI_API_MODEL:-}
      SHOPAGENT_AI_TIMEOUT: ${SHOPAGENT_AI_TIMEOUT:-60}
      SHOPAGENT_SERPER_API_KEY: ${SHOPAGENT_SERPER_API_KEY:-}
      SHOPAGENT_GOOGLE_API_KEY: ${SHOPAGENT_GOOGLE_API_KEY:-}
      SHOPAGENT_GOOGLE_CX: ${SHOPAGENT_GOOGLE_CX:-}
      SHOPAGENT_MAX_COMPARISON_SOURCES: ${SHOPAGENT_MAX_COMPARISON_SOURCES:-8}
      SHOPAGENT_PLAYWRIGHT_HEADLESS: ${SHOPAGENT_PLAYWRIGHT_HEADLESS:-true}
      SHOPAGENT_ALLOW_DEMO_SEED: "true"
      SHOPAGENT_TELEGRAM_BOT_TOKEN: ${SHOPAGENT_TELEGRAM_BOT_TOKEN:-}
      SHOPAGENT_TELEGRAM_CHAT_ID: ${SHOPAGENT_TELEGRAM_CHAT_ID:-}
    ports:
      - "${SHOPAGENT_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================
  # Server-Side Monitoring Worker (Reuses backend image)
  # ==========================================================
  monitoring-worker:
    image: shopagent-backend:latest
    command: ["python", "-m", "app.monitor_worker"]
    environment:
      SHOPAGENT_DATABASE_URL: postgresql+psycopg://shopagent:${POSTGRES_PASSWORD:-shopagent_secure_pass_2026}@db:5432/shopagent
      SHOPAGENT_JWT_SECRET: ${SHOPAGENT_JWT_SECRET:-shopagent-development-secret-key-32chars-min-len}
      SHOPAGENT_TELEGRAM_BOT_TOKEN: ${SHOPAGENT_TELEGRAM_BOT_TOKEN:-}
      SHOPAGENT_TELEGRAM_CHAT_ID: ${SHOPAGENT_TELEGRAM_CHAT_ID:-}
      SHOPAGENT_PLAYWRIGHT_HEADLESS: ${SHOPAGENT_PLAYWRIGHT_HEADLESS:-true}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ==========================================================
  # Next.js Web Application
  # ==========================================================
  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${SHOPAGENT_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  shopagent_pg: